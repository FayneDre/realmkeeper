name: Build server

# Phase 1: builds the "full build" of a core flavor (core + every catalog module
# compiled in, ADR 0003), packages it, then smoke-tests it end to end with a
# portable MySQL 8.4 and upstream server data.
#
# Heavy (~1 h to compile), so it avoids compiling whenever it can:
# - the "plan" job computes the build key (hash of every input that affects
#   the binaries, see tools/ci/build-plan.mjs). If a trusted run on main already
#   produced that artifact (tools/ci/find-artifact.sh), the build is skipped and
#   the smoke test runs on the existing one. `force-build` compiles anyway.
# - on push it runs only for files that affect what is built or tested; a
#   smoke-test-only change therefore costs ~20 min, not a rebuild.
#
# Keep the `build` job immediately followed by `smoke-test`: build-plan.mjs
# hashes the text in between as part of the build recipe.

on:
  workflow_dispatch:
    inputs:
      emulator:
        description: Emulator id
        default: azerothcore
      flavor:
        description: Flavor id
        default: playerbot
      force-build:
        description: Compile even if an artifact with the same build key exists
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - catalog/emulators/**
      - catalog/components/**
      - catalog/clients/**
      - tools/ci/**
      # The MoP prototype has its own workflow (ADR 0024).
      - "!tools/ci/package-pandaria.mjs"
      - "!catalog/emulators/pandaria/**"
      - "!catalog/clients/wow-5-4-8.json"
      - .github/workflows/build-server.yml

permissions:
  contents: read
  actions: read # find and download artifacts of previous runs

concurrency:
  # One queue per flavor: building another flavor must not cancel this one.
  # Queue instead of cancelling: an hour of compilation is not thrown away
  # because another push arrived (GitHub keeps only the newest pending run).
  group: build-server-${{ github.ref }}-${{ inputs.emulator || 'azerothcore' }}-${{ inputs.flavor || 'playerbot' }}
  cancel-in-progress: false

env:
  EMULATOR: ${{ inputs.emulator || 'azerothcore' }}
  FLAVOR: ${{ inputs.flavor || 'playerbot' }}
  # Toolchain dependencies, aligned with the fork's own Windows CI.
  BOOST_VERSION: 1.87.0
  BOOST_ROOT: C:\local\boost_1_87_0
  # Short path: MSVC and CMake choke on long source paths.
  AC_SRC: C:\ac

jobs:
  plan:
    name: Plan (reuse or build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact: ${{ steps.plan.outputs.artifact }}
      build-key: ${{ steps.plan.outputs.build-key }}
      mandatory: ${{ steps.plan.outputs.mandatory }}
      optional: ${{ steps.plan.outputs.optional }}
      database-manifest: ${{ steps.plan.outputs.database-manifest }}
      client-manifest: ${{ steps.plan.outputs.client-manifest }}
      reuse-run-id: ${{ steps.reuse.outputs.run-id }}
      # Linux build of the same sources (ADR 0031).
      artifact-linux: ${{ steps.plan-linux.outputs.artifact }}
      build-key-linux: ${{ steps.plan-linux.outputs.build-key }}
      reuse-run-id-linux: ${{ steps.reuse-linux.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build plan and key
        id: plan
        run: node tools/ci/build-plan.mjs "$EMULATOR" "$FLAVOR" "$RUNNER_TEMP/plan.json"

      - name: Look for a trusted artifact with this build key
        id: reuse
        if: ${{ !inputs.force-build }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.plan.outputs.artifact }}
        run: |
          run_id="$(bash tools/ci/find-artifact.sh "$ARTIFACT")"
          if [ -n "$run_id" ]; then
            echo "Reusing $ARTIFACT from run $run_id: no compilation needed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No reusable $ARTIFACT: compiling." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Linux build plan and key
        id: plan-linux
        env:
          SOURCE_KEY: ${{ steps.plan.outputs.source-key }}
        run: |
          set -euo pipefail
          GITHUB_OUTPUT= node tools/ci/build-plan.mjs "$EMULATOR" "$FLAVOR" "$RUNNER_TEMP/plan-linux.json" linux-x86_64 > /dev/null
          key="$(node -p 'require(process.argv[1]).buildKey' "$RUNNER_TEMP/plan-linux.json")"
          source="$(node -p 'require(process.argv[1]).sourceKey' "$RUNNER_TEMP/plan-linux.json")"
          if [ "$source" != "$SOURCE_KEY" ]; then
            echo "::error::source key $source (Linux) differs from $SOURCE_KEY (Windows): both builds must come from the same sources"
            exit 1
          fi
          echo "build-key=$key" >> "$GITHUB_OUTPUT"
          echo "artifact=server-$EMULATOR-$FLAVOR-$key" >> "$GITHUB_OUTPUT"

      - name: Look for a trusted Linux artifact with this build key
        id: reuse-linux
        if: ${{ !inputs.force-build }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.plan-linux.outputs.artifact }}
        run: |
          run_id="$(bash tools/ci/find-artifact.sh "$ARTIFACT")"
          if [ -n "$run_id" ]; then
            echo "Reusing $ARTIFACT from run $run_id: no Linux compilation needed." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No reusable $ARTIFACT: compiling for Linux." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ inputs.flavor || 'playerbot' }})
    needs: plan
    if: needs.plan.outputs.reuse-run-id == ''
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build plan (must reproduce the plan job's key)
        id: plan
        shell: bash
        env:
          EXPECTED_KEY: ${{ needs.plan.outputs.build-key }}
        run: |
          node tools/ci/build-plan.mjs "$EMULATOR" "$FLAVOR" "$RUNNER_TEMP/plan.json"
          key="$(node -p 'require(process.argv[1]).buildKey' "$RUNNER_TEMP/plan.json")"
          if [ "$key" != "$EXPECTED_KEY" ]; then
            echo "::error::build key $key differs from the plan job's $EXPECTED_KEY (non-deterministic inputs?)"
            exit 1
          fi

      - name: Fetch core and modules at pinned commits
        shell: bash
        run: |
          set -euo pipefail
          fetch() { # <repo> <commit> <dir>
            mkdir -p "$3" && cd "$3"
            git init -q && git remote add origin "$1"
            git fetch -q --depth 1 origin "$2" && git checkout -q FETCH_HEAD
            echo "$(git rev-parse HEAD)  $1 -> $3"
            cd - > /dev/null
          }
          src="$(cygpath "$AC_SRC")"
          fetch "${{ steps.plan.outputs.core-repo }}" "${{ steps.plan.outputs.core-commit }}" "$src"
          # Module directory name == catalog id == dbimport Updates.AllowedModules name.
          node -e 'for (const m of require(process.argv[1]).modules) console.log(`${m.repo} ${m.commit} ${m.id}`)' "$RUNNER_TEMP/plan.json" |
          while read -r repo commit id; do fetch "$repo" "$commit" "$src/modules/$id"; done

      - name: Check module loader names (fails in seconds instead of at link time)
        shell: bash
        run: |
          set -euo pipefail
          # modules/CMakeLists.txt calls Add<directory name, '-' -> '_'>Scripts().
          src="$(cygpath "$AC_SRC")"
          for dir in "$src"/modules/*/; do
            id="$(basename "$dir")"
            fn="Add${id//-/_}Scripts"
            if grep -rqE "void[[:space:]]+${fn}[[:space:]]*\(" "$dir"; then
              echo "ok  $id -> $fn()"
            else
              echo "::error::module directory '$id' needs $fn(), which it does not define. The catalog id must equal the upstream directory name."
              exit 1
            fi
          done

      - name: Read MySQL component version
        id: mysql
        shell: bash
        env:
          MANIFEST: ${{ steps.plan.outputs.database-manifest }}
        run: |
          echo "version=$(node -p 'require("./" + process.env.MANIFEST).version')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(node -p 'require("./" + process.env.MANIFEST).platforms["windows-x86_64"].sha256')" >> "$GITHUB_OUTPUT"

      - name: Cache Boost and MySQL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: deps-boost-${{ env.BOOST_VERSION }}-mysql-${{ steps.mysql.outputs.version }}-${{ steps.mysql.outputs.sha256 }}

      - name: Install Boost and MySQL (client libs)
        shell: pwsh
        env:
          DB_MANIFEST: ${{ steps.plan.outputs.database-manifest }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Download($uri, $out, $agent, $minMB) {
            for ($i = 1; $i -le 3; $i++) {
              try {
                Invoke-WebRequest -Uri $uri -OutFile $out -UserAgent $agent -ConnectionTimeoutSeconds 60 -OperationTimeoutSeconds 120
                $mb = (Get-Item $out).Length / 1MB
                if ($mb -lt $minMB) { throw "got $([int]$mb) MB, expected more than $minMB MB" }
                return
              } catch {
                Write-Host "attempt $i failed for ${uri}: $($_.Exception.Message)"
                if ($i -eq 3) { throw }
                Start-Sleep -Seconds 15
              }
            }
          }
          if (-not (Test-Path "$env:BOOST_ROOT\boost\version.hpp")) {
            $v = $env:BOOST_VERSION; $u = $v -replace '\.', '_'
            $exe = Join-Path $env:RUNNER_TEMP 'boost.exe'
            # SourceForge serves the HTML page to browser user agents.
            Get-Download "https://downloads.sourceforge.net/project/boost/boost-binaries/$v/boost_$u-msvc-14.3-64.exe" $exe 'rk-ci' 50
            $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$env:BOOST_ROOT" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Boost installer exit code $($p.ExitCode)" }
          }
          & ./tools/ci/fetch-mysql.ps1 -Manifest $env:DB_MANIFEST -Destination 'C:\tools\mysql\current'
          $ssl = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } | Select-Object -First 1
          if (-not $ssl) { throw 'OpenSSL development files not found on the runner' }
          "OPENSSL_ROOT_DIR=$ssl" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OpenSSL: $ssl"

      - name: Configure AzerothCore build
        shell: bash
        working-directory: ${{ env.AC_SRC }}
        run: |
          mkdir -p conf
          cat > conf/config.sh <<'EOF'
          CTYPE="Release"
          CSCRIPTS="static"
          CMODULES="static"
          # dbimport is required by the launcher; map extractors are not (upstream data is used).
          CTOOLS_BUILD="db-only"
          # acore.sh defaults to cores + 2 MSBuild projects at once, each with
          # /MP: with every catalog module the modules project ran the
          # runner out of memory (C1060, 2026-11-19). Two projects at a time.
          MTHREADS=2
          EOF
          cat conf/config.sh

      # `compiler build` = configure + compile, split so that _CL_ applies
      # only to the compile: a bad _CL_ breaks CMake's compiler check, which
      # then falls back to the clang path acore.sh always passes (2026-11-19).
      - name: Configure CMake
        shell: bash
        working-directory: ${{ env.AC_SRC }}
        run: ./acore.sh compiler configure

      - name: Build
        shell: bash
        working-directory: ${{ env.AC_SRC }}
        env:
          # The fork's MSVC settings add a bare /MP (one cl per core) to every
          # project: MTHREADS=2 alone still ran the runner out of memory
          # (C1060 in modules.vcxproj, 2026-11-19). _CL_ is appended after the
          # project's options, so its /MP2 wins: at most 2 x 2 compilers.
          # "-MP2", not "/MP2": Git Bash turns a leading slash into a path
          # (C:/Program Files/Git/MP2), which cl then reads as a source file.
          _CL_: -MP2
        run: ./acore.sh compiler compile

      # acore.sh only runs `cmake --install` when $OSTYPE is msys*/linux*/darwin*;
      # the runner's Git Bash reports "cygwin", so nothing would be installed and
      # the binaries would stay in var/build/obj/bin/Release. Install explicitly.
      - name: Install build output
        shell: bash
        working-directory: ${{ env.AC_SRC }}
        run: |
          set -euo pipefail
          echo "OSTYPE=$OSTYPE"
          cmake --install var/build/obj --config Release --prefix "$(cygpath -m "$AC_SRC")/env/dist"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          src="$(cygpath "$AC_SRC")"
          # Runtime DLLs the servers need next to their executables, if the install step did not copy them.
          world="$(find "$src/env/dist" -iname worldserver.exe | head -1)"
          if [ -z "$world" ]; then
            echo "::error::worldserver.exe not found under env/dist"
            exit 1
          fi
          bin="$(dirname "$world")"
          # legacy.dll is the OpenSSL 3 legacy provider: the servers assert it sits next to them
          # (OpenSSLCrypto.cpp SetupLibrariesForWindows). Each name lists its candidate locations.
          ssl="$(cygpath "$OPENSSL_ROOT_DIR")"
          need() {
            local name="$1"; shift
            if [ -f "$bin/$name" ]; then return; fi
            for candidate in "$@"; do
              if [ -f "$candidate" ]; then cp "$candidate" "$bin/$name" && echo "added $name from $candidate"; return; fi
            done
            echo "::error::runtime library $name not found (looked in: $*)"
            exit 1
          }
          need libmysql.dll /c/tools/mysql/current/lib/libmysql.dll
          need libssl-3-x64.dll "$ssl/bin/libssl-3-x64.dll"
          need libcrypto-3-x64.dll "$ssl/bin/libcrypto-3-x64.dll"
          need legacy.dll "$ssl/bin/legacy.dll" "$ssl/lib/ossl-modules/legacy.dll" "$ssl/bin/ossl-modules/legacy.dll"
          node tools/ci/package-server.mjs "$RUNNER_TEMP/plan.json" "$src" "$src/env/dist" "$RUNNER_TEMP/staging"

      - name: Upload server artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/staging
          # Public repo maximum. Reuse does not extend it: a key unchanged for
          # 90 days is compiled once more (release artifacts are kept elsewhere).
          retention-days: 90
          compression-level: 9

  smoke-test:
    name: Smoke test
    needs: [plan, build]
    # Runs after a fresh build, or directly on a reused artifact (build skipped).
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download server artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/server
          run-id: ${{ needs.plan.outputs.reuse-run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Read component and data versions
        id: versions
        shell: bash
        env:
          DB_MANIFEST: ${{ needs.plan.outputs.database-manifest }}
          CLIENT_MANIFEST: ${{ needs.plan.outputs.client-manifest }}
        run: |
          read_json() { node -p "require('./' + process.env.$1).$2"; }
          echo "mysql=$(read_json DB_MANIFEST version)-$(read_json DB_MANIFEST 'platforms["windows-x86_64"].sha256')" >> "$GITHUB_OUTPUT"
          echo "data=$(read_json CLIENT_MANIFEST serverData.version)" >> "$GITHUB_OUTPUT"
          echo "data-url=$(read_json CLIENT_MANIFEST serverData.url)" >> "$GITHUB_OUTPUT"
          echo "data-sha256=$(read_json CLIENT_MANIFEST serverData.sha256)" >> "$GITHUB_OUTPUT"

      - name: Cache MySQL server and server data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            C:\tools\mysql\current
            C:\serverdata
          key: smoke-mysql-${{ steps.versions.outputs.mysql }}-data-${{ steps.versions.outputs.data }}

      - name: Fetch MySQL server and upstream server data
        shell: pwsh
        env:
          DB_MANIFEST: ${{ needs.plan.outputs.database-manifest }}
          DATA_URL: ${{ steps.versions.outputs.data-url }}
          DATA_SHA256: ${{ steps.versions.outputs.data-sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          & ./tools/ci/fetch-mysql.ps1 -Manifest $env:DB_MANIFEST -Destination 'C:\tools\mysql\current'
          if (-not (Test-Path 'C:\serverdata')) {
            $zip = Join-Path $env:RUNNER_TEMP 'data.zip'
            for ($i = 1; $i -le 3; $i++) {
              try { Invoke-WebRequest $env:DATA_URL -OutFile $zip; break }
              catch {
                Write-Host "attempt $i failed: $($_.Exception.Message)"
                if ($i -eq 3) { throw }
                Start-Sleep -Seconds 30
              }
            }
            # Same integrity rule as the launcher (ADR 0006): pinned sha256 or abort.
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $env:DATA_SHA256) { throw "server data sha256 mismatch: $hash" }
            Write-Host "server data sha256 verified"
            Expand-Archive $zip 'C:\serverdata' -Force
          }
          Get-ChildItem 'C:\serverdata' -Depth 1 | Select-Object FullName

      - name: Smoke test (modules off, then on)
        shell: bash
        env:
          MANDATORY: ${{ needs.plan.outputs.mandatory }}
          OPTIONAL: ${{ needs.plan.outputs.optional }}
          DB_MANIFEST: ${{ needs.plan.outputs.database-manifest }}
        run: >
          node tools/ci/smoke-test.mjs
          --staging "$RUNNER_TEMP/server"
          --mysql "C:/tools/mysql/current"
          --mysql-manifest "$DB_MANIFEST"
          --data "C:/serverdata"
          --work "$RUNNER_TEMP/instance"
          --snapshot "$RUNNER_TEMP/db-snapshot"
          --mandatory "$MANDATORY"
          --optional "$OPTIONAL"

      # Database snapshot (ADR 0009), made by the smoke test from this exact
      # artifact before any server ran, and validated by both rounds.
      - name: Upload database snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-snapshot-${{ needs.plan.outputs.build-key }}
          path: ${{ runner.temp }}/db-snapshot
          retention-days: 90
          compression-level: 6

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-${{ needs.plan.outputs.build-key }}
          path: ${{ runner.temp }}/instance/logs
          retention-days: 14

  # Linux build of the same sources (ADR 0031), for the Steam Deck and desktop
  # Linux. Built on Ubuntu 22.04 (glibc 2.35, older than SteamOS); every
  # library outside the system base travels in lib/ (bundle-libs.sh). Keep it
  # immediately followed by `smoke-test-linux`: build-plan.mjs hashes it.
  build-linux:
    name: Build Linux (${{ inputs.flavor || 'playerbot' }})
    needs: plan
    if: needs.plan.outputs.reuse-run-id-linux == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      AC_SRC: /home/runner/ac
      MYSQL_DIR: /home/runner/mysql
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build plan (must reproduce the plan job's key)
        id: plan
        env:
          EXPECTED_KEY: ${{ needs.plan.outputs.build-key-linux }}
        run: |
          node tools/ci/build-plan.mjs "$EMULATOR" "$FLAVOR" "$RUNNER_TEMP/plan.json" linux-x86_64
          key="$(node -p 'require(process.argv[1]).buildKey' "$RUNNER_TEMP/plan.json")"
          if [ "$key" != "$EXPECTED_KEY" ]; then
            echo "::error::build key $key differs from the plan job's $EXPECTED_KEY (non-deterministic inputs?)"
            exit 1
          fi

      - name: Fetch core and modules at pinned commits
        run: |
          set -euo pipefail
          fetch() { # <repo> <commit> <dir>
            mkdir -p "$3" && cd "$3"
            git init -q && git remote add origin "$1"
            git fetch -q --depth 1 origin "$2" && git checkout -q FETCH_HEAD
            echo "$(git rev-parse HEAD)  $1 -> $3"
            cd - > /dev/null
          }
          fetch "${{ steps.plan.outputs.core-repo }}" "${{ steps.plan.outputs.core-commit }}" "$AC_SRC"
          node -e 'for (const m of require(process.argv[1]).modules) console.log(`${m.repo} ${m.commit} ${m.id}`)' "$RUNNER_TEMP/plan.json" |
          while read -r repo commit id; do fetch "$repo" "$commit" "$AC_SRC/modules/$id"; done

      - name: Check module loader names
        run: |
          set -euo pipefail
          for dir in "$AC_SRC"/modules/*/; do
            id="$(basename "$dir")"
            fn="Add${id//-/_}Scripts"
            if ! grep -rqE "void[[:space:]]+${fn}[[:space:]]*\(" "$dir"; then
              echo "::error::module directory '$id' needs $fn(), which it does not define."
              exit 1
            fi
          done

      - name: Install build dependencies
        env:
          DB_MANIFEST: ${{ needs.plan.outputs.database-manifest }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends cmake make clang libssl-dev libbz2-dev \
            libreadline-dev libncurses-dev libboost-all-dev zlib1g-dev patchelf binutils xz-utils
          # MySQL client library and headers: the pinned component, bundled with the servers.
          bash tools/ci/fetch-mysql.sh "$DB_MANIFEST" "$MYSQL_DIR" linux-x86_64

      # CONF_DIR is both where configs are installed and the path compiled
      # into the servers (_CONF_DIR, Config.cpp GetConfigPath on Linux):
      # relative "configs" makes them read configs/ and configs/modules/ in
      # their working directory, the instance root, as on Windows.
      - name: Configure CMake
        run: >
          cmake -S "$AC_SRC" -B "$AC_SRC/var/build"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$AC_SRC/env/install"
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-include utility"
          -DAPPS_BUILD=all -DTOOLS_BUILD=db-only
          -DSCRIPTS=static -DMODULES=static
          -DBUILD_TESTING=OFF -DWITH_WARNINGS=OFF
          -DUSE_COREPCH=ON -DUSE_SCRIPTPCH=ON
          -DBoost_USE_STATIC_LIBS=ON
          -DCONF_DIR=configs
          -DMYSQL_INCLUDE_DIR="$MYSQL_DIR/include"
          -DMYSQL_LIBRARY="$MYSQL_DIR/lib/libmysqlclient.so"

      - name: Build
        run: cmake --build "$AC_SRC/var/build" --config Release -j "$(nproc)"

      - name: Install and package
        run: |
          set -euo pipefail
          cmake --install "$AC_SRC/var/build" --config Release
          install="$AC_SRC/env/install"
          # Same layout as the Windows build: programs at the root, configs/.
          dist="$AC_SRC/env/dist"
          mkdir -p "$dist/configs"
          for exe in worldserver authserver dbimport; do
            cp "$install/bin/$exe" "$dist/$exe"
          done
          cp -r "$install/configs/." "$dist/configs/"
          LD_LIBRARY_PATH="$MYSQL_DIR/lib" bash tools/ci/bundle-libs.sh "$dist" "$dist/worldserver" "$dist/authserver" "$dist/dbimport"
          ls -la "$dist" "$dist/lib" "$dist/configs"
          node tools/ci/package-server.mjs "$RUNNER_TEMP/plan.json" "$AC_SRC" "$dist" "$RUNNER_TEMP/staging"

      - name: Upload server artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.plan.outputs.artifact-linux }}
          path: ${{ runner.temp }}/staging
          retention-days: 90
          compression-level: 9

  # The Linux smoke test runs in an Arch Linux container, the base of SteamOS:
  # a library the servers or MySQL take from the system but SteamOS lacks
  # fails here, not on a Steam Deck.
  smoke-test-linux:
    name: Smoke test Linux (Arch)
    needs: [plan, build-linux]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: archlinux:base
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed nodejs curl xz zstd binutils tar unzip git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download server artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact-linux }}
          path: ${{ runner.temp }}/server
          run-id: ${{ needs.plan.outputs.reuse-run-id-linux || github.run_id }}
          github-token: ${{ github.token }}

      - name: Read component and data versions
        id: versions
        env:
          DB_MANIFEST: ${{ needs.plan.outputs.database-manifest }}
          CLIENT_MANIFEST: ${{ needs.plan.outputs.client-manifest }}
        run: |
          read_json() { node -p "require('./' + process.env.$1).$2"; }
          echo "mysql=$(read_json DB_MANIFEST version)-$(read_json DB_MANIFEST 'platforms["linux-x86_64"].sha256')" >> "$GITHUB_OUTPUT"
          echo "data=$(read_json CLIENT_MANIFEST serverData.version)" >> "$GITHUB_OUTPUT"
          echo "data-url=$(read_json CLIENT_MANIFEST serverData.url)" >> "$GITHUB_OUTPUT"
          echo "data-sha256=$(read_json CLIENT_MANIFEST serverData.sha256)" >> "$GITHUB_OUTPUT"

      - name: Cache MySQL server and server data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /opt/mysql
            /opt/serverdata
          key: smoke-linux-mysql-${{ steps.versions.outputs.mysql }}-data-${{ steps.versions.outputs.data }}

      - name: Fetch MySQL server and upstream server data
        env:
          DB_MANIFEST: ${{ needs.plan.outputs.database-manifest }}
          DATA_URL: ${{ steps.versions.outputs.data-url }}
          DATA_SHA256: ${{ steps.versions.outputs.data-sha256 }}
        run: |
          set -euo pipefail
          bash tools/ci/fetch-mysql.sh "$DB_MANIFEST" /opt/mysql linux-x86_64
          if [ ! -d /opt/serverdata ]; then
            curl -fsSL --retry 3 --retry-delay 30 -o "$RUNNER_TEMP/data.zip" "$DATA_URL"
            # Same integrity rule as the launcher (ADR 0006): pinned sha256 or abort.
            echo "$DATA_SHA256  $RUNNER_TEMP/data.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/data.zip" -d /opt/serverdata
            rm "$RUNNER_TEMP/data.zip"
          fi

      - name: Smoke test (modules off, then on)
        env:
          MANDATORY: ${{ needs.plan.outputs.mandatory }}
          OPTIONAL: ${{ needs.plan.outputs.optional }}
          DB_MANIFEST: ${{ needs.plan.outputs.database-manifest }}
        run: |
          set -euo pipefail
          # Artifacts do not keep file modes.
          chmod +x "$RUNNER_TEMP"/server/dist/{worldserver,authserver,dbimport}
          node tools/ci/smoke-test.mjs \
            --staging "$RUNNER_TEMP/server" \
            --mysql /opt/mysql \
            --mysql-manifest "$DB_MANIFEST" \
            --data /opt/serverdata \
            --work "$RUNNER_TEMP/instance" \
            --snapshot "$RUNNER_TEMP/db-snapshot" \
            --mandatory "$MANDATORY" \
            --optional "$OPTIONAL"

      - name: Upload database snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-snapshot-${{ needs.plan.outputs.build-key-linux }}
          path: ${{ runner.temp }}/db-snapshot
          retention-days: 90
          compression-level: 6

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-${{ needs.plan.outputs.build-key-linux }}
          path: ${{ runner.temp }}/instance/logs
          retention-days: 14

  # Publication (ADR 0010): GitHub release per build + the signed index.
  # Only from main, after a green smoke test. The server ZIP of a build key is
  # uploaded once and never replaced (the index may already point at it); the
  # database snapshot of each run gets its own asset name, the two newest are
  # kept. Without the signing secret, publication is skipped with a warning.
  publish:
    name: Publish (releases + signed index)
    needs: [plan, build, smoke-test, build-linux, smoke-test-linux]
    # The Windows build gates the publication; the Linux one joins it when its
    # own smoke test passed (ADR 0031: a missing Linux build only delays the
    # Deck, it never holds back Windows players).
    if: ${{ !cancelled() && needs.smoke-test.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # releases and their assets
      actions: read
    concurrency:
      # One index writer at a time, whatever the flavor: serial + 1 must not race.
      group: publish-index
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PREFIX: build-${{ inputs.emulator || 'azerothcore' }}-${{ inputs.flavor || 'playerbot' }}
      HAS_KEY: ${{ secrets.RK_INDEX_SIGNING_KEY != '' }}
      LINUX: ${{ needs.smoke-test-linux.result == 'success' }}
    steps:
      - name: Check the signing key
        if: env.HAS_KEY != 'true'
        run: echo "::warning::RK_INDEX_SIGNING_KEY is not set, nothing is published."

      - name: Note a missing Linux build
        if: env.HAS_KEY == 'true' && env.LINUX != 'true'
        run: echo "::warning::the Linux smoke test did not pass, only the Windows build is published."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_KEY == 'true'
        with:
          node-version: 24

      - name: Download the tested Windows server artifact
        if: env.HAS_KEY == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: ${{ runner.temp }}/windows-x86_64/server
          run-id: ${{ needs.plan.outputs.reuse-run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download this run's Windows database snapshot
        if: env.HAS_KEY == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: db-snapshot-${{ needs.plan.outputs.build-key }}
          path: ${{ runner.temp }}/windows-x86_64/db-snapshot

      - name: Download the tested Linux server artifact
        if: env.HAS_KEY == 'true' && env.LINUX == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact-linux }}
          path: ${{ runner.temp }}/linux-x86_64/server
          run-id: ${{ needs.plan.outputs.reuse-run-id-linux || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download this run's Linux database snapshot
        if: env.HAS_KEY == 'true' && env.LINUX == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: db-snapshot-${{ needs.plan.outputs.build-key-linux }}
          path: ${{ runner.temp }}/linux-x86_64/db-snapshot

      - name: Release assets
        if: env.HAS_KEY == 'true'
        env:
          KEY_WINDOWS: ${{ needs.plan.outputs.build-key }}
          KEY_LINUX: ${{ needs.plan.outputs.build-key-linux }}
        run: |
          set -euo pipefail
          platforms=(windows-x86_64)
          if [ "$LINUX" = true ]; then platforms+=(linux-x86_64); fi
          for platform in "${platforms[@]}"; do
            in="$RUNNER_TEMP/$platform"
            out="$in/out"; mkdir -p "$out"
            if [ "$platform" = linux-x86_64 ]; then
              key="$KEY_LINUX"
              # Artifacts do not keep file modes; the release ZIP records them.
              chmod +x "$in"/server/dist/{worldserver,authserver,dbimport}
              modes=(--unix-modes)
            else
              key="$KEY_WINDOWS"
              modes=()
            fi
            tag="$PREFIX-$key"
            server="server-$key.zip"
            snapshot="db-snapshot-$key-r$GITHUB_RUN_ID.zip"
            # zstd entries (ADR 0015): about a third smaller than deflate.
            node tools/ci/zip-zstd.mjs "$in/db-snapshot" "$out/$snapshot" "${modes[@]}"
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "release $tag exists"
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
                --notes "Server build $key for $platform (core and module commits in build-info.json). Installed by the launcher through the signed index; not meant to be downloaded by hand."
            fi
            if gh release view "$tag" --json assets -q '.assets[].name' | grep -qx "$server"; then
              # Never replaced: reuse the published bytes (the index hashes them).
              gh release download "$tag" --pattern "$server" --dir "$out"
            else
              node tools/ci/zip-zstd.mjs "$in/server" "$out/$server" "${modes[@]}"
              gh release upload "$tag" "$out/$server"
            fi
            gh release upload "$tag" "$out/$snapshot"
            base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
            node tools/ci/index.mjs entry \
              --build-info "$in/server/build-info.json" \
              --snapshot "$in/db-snapshot/snapshot.json" \
              --platform "$platform" \
              --server "$out/$server" --server-url "$base/$server" \
              --db-snapshot "$out/$snapshot" --db-snapshot-url "$base/$snapshot" \
              --out "$RUNNER_TEMP/entry-$platform.json"
            echo "$tag" >> "$RUNNER_TEMP/tags.txt"
          done

      - name: Update and sign the index
        if: env.HAS_KEY == 'true'
        env:
          RK_INDEX_SIGNING_KEY: ${{ secrets.RK_INDEX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/index"; mkdir -p "$out"
          if ! gh release view index > /dev/null 2>&1; then
            gh release create index --latest=false --title "Artifact index" \
              --notes "Signed index read by the launcher (ADR 0010). Do not edit."
          fi
          current=()
          if gh release download index --pattern index.json --dir "$out/previous" 2>/dev/null; then
            current=(--previous "$out/previous/index.json")
          fi
          # One update per platform entry, each on top of the previous one.
          n=0
          for entry in "$RUNNER_TEMP"/entry-*.json; do
            n=$((n + 1))
            node tools/ci/index.mjs update "${current[@]}" --entry "$entry" --out "$out/index-$n.json"
            current=(--previous "$out/index-$n.json")
          done
          cp "$out/index-$n.json" "$out/index.json"
          node tools/ci/index.mjs verify "$out/index.json" > /dev/null
          gh release upload index "$out/index.json" --clobber
          echo "Published $(paste -sd' ' "$RUNNER_TEMP/tags.txt") and index serial $(node -p "JSON.parse(require('$out/index.json').payload).serial")" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the two newest snapshots of each build
        if: env.HAS_KEY == 'true'
        run: |
          set -euo pipefail
          while read -r tag; do
            gh release view "$tag" --json assets -q '.assets[] | select(.name | startswith("db-snapshot-")) | "\(.createdAt) \(.name)"' |
              sort -r | tail -n +3 | while read -r _ name; do
                echo "deleting old snapshot $name"
                gh release delete-asset "$tag" "$name" --yes
              done
          done < "$RUNNER_TEMP/tags.txt"
