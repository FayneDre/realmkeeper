name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A branch on demand (Linux code cannot be compiled on a Windows desk).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (full workspace + UI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JS dependencies
        run: npm ci

      - name: UI type-check, catalog schema, i18n parity
        run: npm run check

      - name: Build UI (required by tauri::generate_context!)
        run: npm run build --workspace app

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: MySQL version (for the rk-db integration tests)
        id: mysql
        shell: bash
        run: echo "key=$(node -p 'const c=require("./catalog/components/mysql-8-4.json"); c.version + "-" + c.platforms["windows-x86_64"].sha256')" >> "$GITHUB_OUTPUT"

      - name: Cache MySQL
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\tools\mysql\current
          key: ci-mysql-${{ steps.mysql.outputs.key }}

      - name: Fetch MySQL (pinned sha256)
        shell: pwsh
        run: ./tools/ci/fetch-mysql.ps1 -Manifest catalog/components/mysql-8-4.json -Destination 'C:\tools\mysql\current'

      - name: tests (incl. real MySQL lifecycle)
        env:
          RK_MYSQL_BASEDIR: C:\tools\mysql\current
        run: cargo test --workspace --locked

      - name: Catalog cross-reference validation
        run: cargo run --locked -p rk-cli -- catalog validate

      # The debug app with its WebView2 debugging port open, driven over the
      # DevTools protocol on an empty data root (nothing is installed).
      - name: Build the debug app for the UI smoke test
        working-directory: app
        run: |
          node ../tools/ci/ui-smoke.mjs config ../target/ui-smoke.tauri.json
          npx tauri build --debug --no-bundle --config ../target/ui-smoke.tauri.json

      - name: UI smoke test
        run: node tools/ci/ui-smoke.mjs run --exe target/debug/realmkeeper.exe --shots target/ui-smoke-shots

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-shots
          path: target/ui-smoke-shots
          if-no-files-found: ignore
          retention-days: 7

  dependencies:
    name: Dependencies (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # deny.toml: RustSec advisories, licences compatible with
      # GPL-3.0-or-later, crates from crates.io only.
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories licenses sources bans
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit (shipped dependencies)
        run: npm audit --omit=dev --audit-level=moderate

  # The whole workspace, app included (ADR 0031): Linux code cannot be
  # compiled on a Windows desk. Ubuntu 22.04 like the AppImage build.
  linux:
    name: Linux (full workspace + app)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: System libraries of the Tauri app (WebKitGTK, tray)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file

      - name: Install Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JS dependencies
        run: npm ci

      - name: Build UI (required by tauri::generate_context!)
        run: npm run build --workspace app

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: tests
        run: cargo test --workspace --locked

      # A branch run on demand also packs the AppImage, to try on a Deck
      # (no update feed: release-app.yml makes the published one).
      - name: AppImage (on demand)
        if: github.event_name == 'workflow_dispatch'
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          sudo apt-get install -y -q --no-install-recommends libfuse2
          npx tauri build --bundles appimage

      - name: Upload the AppImage
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-test
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
