name: Release launcher

# Builds the Windows installer (NSIS, per-user, no admin rights) and the
# Linux AppImage (ADR 0031: SteamOS installs nothing system-wide) and
# publishes them as release `app-v<version>`; the update feed `latest.json`
# lives in the rolling `app-latest` release (ADR 0015).
#
# Optional, each enabled by its repository settings:
# - code signing through SignPath: secret SIGNPATH_API_TOKEN, variables
#   SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG;
# - auto-update: variable RK_UPDATER_PUBKEY, secrets
#   TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
# Without them the installer is published unsigned / without auto-update.
# The AppImage has no Authenticode equivalent: only the update signature.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Publish as a draft (not offered to the launchers)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-app
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
  HAS_UPDATER: ${{ vars.RK_UPDATER_PUBKEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

jobs:
  build:
    name: Build installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      unsigned-id: ${{ steps.unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JS dependencies
        run: npm ci

      - name: Checks
        run: npm run check

      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node tools/ci/app-release.mjs version)
          # Fails now, not after the build, when the notes are missing.
          node tools/ci/app-release.mjs notes --version "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release config
        shell: bash
        env:
          PUBKEY: ${{ env.HAS_UPDATER == 'true' && vars.RK_UPDATER_PUBKEY || '' }}
        run: |
          node tools/ci/app-release.mjs config --out "$RUNNER_TEMP/release.conf.json" \
            --pubkey "$PUBKEY" \
            --feed "https://github.com/${{ github.repository }}/releases/download/app-latest/latest.json"

      # No updater key here: every build script of every dependency runs in
      # this step. The update signature is made later, over the final
      # (SignPath-signed) installer, in a step that runs no dependency code.
      - name: Build
        shell: bash
        run: |
          cd app
          npx tauri build --bundles nsis --config "$RUNNER_TEMP/release.conf.json"

      # Tauri names it after the product ("RealmKeeper_..."): a name
      # without spaces keeps the release asset URL in the feed exact.
      - name: Collect the installer
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned"
          built=(target/release/bundle/nsis/*-setup.exe)
          [ "${#built[@]}" -eq 1 ] || { echo "::error::expected one installer, found ${#built[@]}"; exit 1; }
          cp "${built[0]}" "$RUNNER_TEMP/unsigned/RealmKeeper_${VERSION}_x64-setup.exe"
          ls -l "$RUNNER_TEMP/unsigned"

      - name: Upload the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-unsigned
          path: ${{ runner.temp }}/unsigned/*-setup.exe
          if-no-files-found: error

  # Ubuntu 22.04: the oldest glibc of the supported systems (SteamOS has a
  # newer one). The AppImage carries WebKitGTK and the tray library.
  build-linux:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: System libraries of the Tauri app (WebKitGTK, tray, AppImage tools)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file libfuse2

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install JS dependencies
        run: npm ci

      - name: Release config
        env:
          PUBKEY: ${{ env.HAS_UPDATER == 'true' && vars.RK_UPDATER_PUBKEY || '' }}
        run: |
          node tools/ci/app-release.mjs config --out "$RUNNER_TEMP/release.conf.json" \
            --pubkey "$PUBKEY" \
            --feed "https://github.com/${{ github.repository }}/releases/download/app-latest/latest.json"

      # Same rule as the Windows build: no updater key where dependency
      # code runs. tauri.linux.conf.json selects the AppImage target.
      - name: Build
        env:
          # linuxdeploy is itself an AppImage: run it without FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          cd app
          npx tauri build --bundles appimage --config "$RUNNER_TEMP/release.conf.json"

      - name: Collect the AppImage
        run: |
          set -euo pipefail
          version=$(node tools/ci/app-release.mjs version)
          mkdir -p "$RUNNER_TEMP/appimage"
          built=(target/release/bundle/appimage/*.AppImage)
          [ "${#built[@]}" -eq 1 ] || { echo "::error::expected one AppImage, found ${#built[@]}"; exit 1; }
          cp "${built[0]}" "$RUNNER_TEMP/appimage/RealmKeeper_${version}_amd64.AppImage"
          chmod +x "$RUNNER_TEMP/appimage/"*.AppImage
          ls -l "$RUNNER_TEMP/appimage"

      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: ${{ runner.temp }}/appimage/*.AppImage
          if-no-files-found: error

  sign:
    name: Sign (SignPath)
    needs: build
    runs-on: windows-latest
    steps:
      - name: Submit the signing request
        if: env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.unsigned-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/installer

      - name: Unsigned installer (no SignPath configuration)
        if: env.HAS_SIGNPATH != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-unsigned
          path: ${{ runner.temp }}/installer

      - name: Note
        if: env.HAS_SIGNPATH != 'true'
        shell: bash
        run: echo "::warning::SignPath is not configured, the installer is published unsigned."

      - name: Upload the installer to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: ${{ runner.temp }}/installer/*-setup.exe
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, sign, build-linux]
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # gh runs outside the checkout (in the download folder).
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: ${{ runner.temp }}/out

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: ${{ runner.temp }}/out

      # The update signature covers the final (signed) installer bytes.
      - name: Update signature and feed
        if: env.HAS_UPDATER == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          installer="RealmKeeper_${VERSION}_x64-setup.exe"
          appimage="RealmKeeper_${VERSION}_amd64.AppImage"
          for file in "$installer" "$appimage"; do
            (cd "$GITHUB_WORKSPACE/app" && npx tauri signer sign "$RUNNER_TEMP/out/$file")
          done
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/app-v$VERSION"
          node "$GITHUB_WORKSPACE/tools/ci/app-release.mjs" feed --version "$VERSION" \
            --installer-url "$base/$installer" --signature "$installer.sig" \
            --appimage-url "$base/$appimage" --appimage-signature "$appimage.sig" --out latest.json

      - name: Release
        shell: bash
        env:
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          tag="app-v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::$tag already exists: bump the version in app/src-tauri/tauri.conf.json"
            exit 1
          fi
          node "$GITHUB_WORKSPACE/tools/ci/app-release.mjs" notes --version "$VERSION" > notes.md
          flags=(--title "RealmKeeper $VERSION" --notes-file notes.md)
          [ "$DRAFT" = "true" ] && flags+=(--draft)
          gh release create "$tag" --target "$GITHUB_SHA" "${flags[@]}" "RealmKeeper_${VERSION}_x64-setup.exe" "RealmKeeper_${VERSION}_amd64.AppImage"
          # The feed moves only for a public release: a draft never reaches
          # the players' auto-update.
          if [ -f latest.json ] && [ "$DRAFT" != "true" ]; then
            if ! gh release view app-latest > /dev/null 2>&1; then
              gh release create app-latest --latest=false --title "Launcher update feed" \
                --notes "Read by the launcher's auto-update. Not meant to be downloaded by hand."
            fi
            gh release upload app-latest latest.json --clobber
          fi
